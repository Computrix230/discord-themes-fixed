<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <style>
    .core { fill: none; stroke: #00c8dc; stroke-width: 3; }
    .thin { fill: none; stroke: #00c8dc; stroke-width: 1.5; opacity: .55; }
    .ghost-r { fill: none; stroke: #ff4d6a; stroke-width: 3; opacity: .7; mix-blend-mode: screen; animation: gr 3.2s steps(1) infinite; }
    .ghost-b { fill: none; stroke: #4f7dff; stroke-width: 3; opacity: .7; mix-blend-mode: screen; animation: gb 3.2s steps(1) infinite; }
    .scan { fill: #00c8dc; opacity: .5; animation: scan 2.4s linear infinite; }
    .pupil { fill: #00c8dc; animation: blink 6s infinite; transform-origin: 48px 48px; }
    .slice { fill: #00c8dc; opacity: 0; animation: slice 3.2s steps(1) infinite; }
    @keyframes gr { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 90% { transform: translate(-3px,1px); opacity: .7; } 94% { transform: translate(2px,-1px); opacity: .7; } }
    @keyframes gb { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 90% { transform: translate(3px,-1px); opacity: .7; } 94% { transform: translate(-2px,1px); opacity: .7; } }
    @keyframes slice { 0%,89%,100% { opacity: 0; } 90% { opacity: .9; transform: translateX(-6px); } 93% { opacity: .9; transform: translateX(5px); } 96% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(18px); } 100% { transform: translateY(60px); } }
    @keyframes blink { 0%,46%,50%,100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  </style>

  <!-- background -->
  <rect width="96" height="96" fill="#060e1a"/>

  <!-- glitch ghosts (red / blue split) -->
  <g class="ghost-r">
    <polygon points="48,12 79,30 79,66 48,84 17,66 17,30"/>
    <path d="M24 48 Q48 26 72 48 Q48 70 24 48 Z"/>
  </g>
  <g class="ghost-b">
    <polygon points="48,12 79,30 79,66 48,84 17,66 17,30"/>
    <path d="M24 48 Q48 26 72 48 Q48 70 24 48 Z"/>
  </g>

  <!-- emblem: hexagon frame + scanning eye -->
  <polygon class="core" points="48,12 79,30 79,66 48,84 17,66 17,30"/>
  <polygon class="thin" points="48,20 72,34 72,62 48,76 24,62 24,34"/>
  <path class="core" d="M24 48 Q48 26 72 48 Q48 70 24 48 Z"/>
  <circle class="pupil" cx="48" cy="48" r="7"/>

  <!-- scan line -->
  <rect class="scan" x="20" y="0" width="56" height="1.5"/>

  <!-- glitch slices -->
  <rect class="slice" x="14" y="38" width="68" height="3"/>
  <rect class="slice" x="14" y="57" width="68" height="2" style="animation-delay:.1s"/>
</svg>
